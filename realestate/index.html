<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블라인드 서울</title>
<meta name="description" content="몇 년도인지 모르는 채 종잣돈 10억으로 서울 아파트·빌라에 120개월 동안 투자하는 게임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-tab="home">
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 class="logo">블라인드 서울</h1>
      <span class="turn" id="turn-label">0 / 120개월</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="k">현금</span><span class="v num" id="s-cash">10억</span></div>
      <div class="stat"><span class="k">순자산</span><span class="v num" id="s-net">10억</span></div>
      <div class="stat"><span class="k">대출 금리</span><span class="v num" id="s-rate">4.00%</span></div>
    </div>
    <button class="btn small ghost" id="btn-howto" type="button">게임 방법</button>
  </div>
  <div class="months" id="months" aria-hidden="true"></div>
  <nav class="tabs" id="tabs" aria-label="화면 전환">
    <button type="button" data-go="home">현황<i class="dot" hidden></i></button>
    <button type="button" data-go="market">시세</button>
    <button type="button" data-go="listings">매물<span class="badge" id="tab-listings"></span></button>
    <button type="button" data-go="props">내 집<span class="badge" id="tab-props"></span></button>
    <button type="button" data-go="log">기록</button>
  </nav>
</header>

<main class="wrap">
  <div id="alert" class="alert" hidden></div>

  <section class="dash" data-tab="home" aria-label="자산 현황">
    <article class="panel dash-card" id="card-net"></article>
    <article class="panel dash-card" id="card-mix"></article>
    <article class="panel dash-card" id="card-flow"></article>
  </section>

  <section class="panel market-panel" data-tab="market">
    <div class="panel-head"><h2>시세판</h2><span class="aside">시작 시점 = 100</span></div>
    <div class="market-layout">
      <div class="market-chart-col">
        <div class="legend">
          <span><i style="background: var(--series-gn)"></i>강남 아파트</span>
          <span><i style="background: var(--series-gb)"></i>강북 아파트</span>
        </div>
        <div class="chart" id="market-chart"></div>
      </div>
      <div id="market"></div>
    </div>
  </section>

  <div class="grid">
    <div class="col">
      <section class="panel" id="report" data-tab="home" aria-live="polite"></section>
      <section class="panel" data-tab="props">
        <div class="panel-head"><h2>내 부동산</h2><span class="aside" id="props-aside"></span></div>
        <div id="props"></div>
      </section>
    </div>
    <div class="col">
      <section class="panel" data-tab="listings">
        <div class="panel-head"><h2>이번 달 매물</h2><span class="aside" id="listings-aside"></span></div>
        <div class="listings" id="listings"></div>
      </section>
      <section class="panel" data-tab="log">
        <div class="panel-head"><h2>기록</h2><button class="btn small" id="btn-new" type="button">새 게임</button></div>
        <ul class="log" id="log"></ul>
      </section>
    </div>
  </div>
</main>

<p class="foot">시세는 KB 주택가격동향·한국은행 금리의 연간 흐름을 월별로 펼친 근사치이며 공식 통계가 아닙니다. 세법과 대출 규제는 현행 제도를 단순화했습니다.</p>

<nav class="actionbar" aria-label="게임 진행">
  <div class="actionbar-in">
    <div class="ab-info" id="ab-info"></div>
    <button class="btn" id="btn-auto" type="button">자동 진행</button>
    <button class="btn primary" id="btn-next" type="button">다음 달</button>
  </div>
</nav>

<dialog id="dlg"><div id="dlg-body"></div></dialog>

<template id="howto-tpl">
  <div class="dlg howto">
    <div><div class="eyebrow">게임 방법</div><h3>10억으로 서울 10년 버티기</h3></div>
    <ul>
      <li><b>목표:</b> 종잣돈 10억으로 120개월(10년) 동안 서울 아파트·빌라에 투자합니다. 끝날 때의 순자산(현금 + 집값 − 대출 − 보증금)이 점수입니다.</li>
      <li><b>몇 년도인지 모릅니다:</b> 1986~2025년 중 무작위로 고른 120개월의 시세 흐름을 따릅니다. 시작 가격(2025년 수준 시세)과 시작 금리(4%)는 매판 같아서 연도는 게임이 끝나야 공개됩니다.</li>
      <li><b>매물:</b> 지금 현금으로 살 수 있는 매물만 나옵니다(대출 한도까지 받는다고 가정). 하나를 사면 남은 현금에 맞춰 새 매물이 채워집니다.</li>
      <li><b>대출:</b> 무주택자는 집값의 60%, 1주택자는 40%, 2주택 이상은 30%까지 빌릴 수 있고, 1건당 최대 6억입니다. 정부 대책이 나오면 한도가 줄거나 늘어납니다.</li>
      <li><b>세입자:</b> 집을 사면 전세나 월세 세입자를 구합니다. 전세 보증금이 들어오면 대출부터 갚습니다. 못 구하면 대출 이자만 나갑니다.</li>
      <li><b>만기:</b> 계약은 2년입니다. 세입자가 나가는데 다음 세입자를 못 구하면 보증금을 현금으로 돌려줘야 합니다. 전세 시세가 떨어지면 재계약 때 차액을 돌려줍니다(역전세).</li>
      <li><b>매도:</b> 내놓는다고 바로 팔리지 않습니다. 매달 체결 확률에 따라 팔리고, 하락장일수록 잘 안 팔립니다. 급매로 내놓으면 빨리 팔립니다.</li>
      <li><b>경매:</b> 현금이 마이너스인 채로 3개월이 지나면 빚이 가장 많은 집이 시세 70%에 경매로 넘어갑니다. 대출을 한도까지 쓰고 현금을 남기지 않으면 공실·금리 인상·역전세 한 번에 무너질 수 있습니다.</li>
      <li><b>월세 연체:</b> 세입자가 월세를 3개월 넘게 밀리면 명도소송을 할지 묻습니다. 밀린 월세는 보증금에서 공제합니다.</li>
      <li><b>현황판:</b> 순자산 추이, 자산 구성(내 돈·대출·보증금), 월 현금흐름을 그래프로 보여줍니다. 전세 보증금이 들어와 현금이 늘어도 돌려줄 돈이라 순자산은 그대로입니다.</li>
      <li><b>세금:</b> 취득세는 2주택까지 6억 이하 1% · 9억 이하 2% · 초과 3%, 3주택 8%, 4주택 이상 12%. 양도세는 1년 미만 70% · 2년 미만 60% · 이후 기본세율이고, 1주택을 2년 넘게 보유하면 12억까지 비과세입니다. 보유세(재산세·종부세)는 12개월마다 내며 다주택일수록 무겁습니다.</li>
    </ul>
    <div class="dlg-actions"><button class="btn primary" type="button" id="howto-close">시작하기</button></div>
  </div>
</template>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
